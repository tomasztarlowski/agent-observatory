<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Replay a sample multi-agent workflow and inspect who did what, when.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Agent Observatory</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-inner">
      <a class="wordmark" href="./">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        Agent Observatory
      </a>
      <button id="share" class="button" type="button">Copy view link</button>
    </div>
  </header>
  <main class="shell">
    <section class="intro" aria-labelledby="run-title">
      <div>
        <h1 id="run-title"></h1>
        <p id="run-description"></p>
      </div>
      <label class="scenario">Demo scenario
        <select id="scenario"></select>
      </label>
    </section>
    <section class="playback" aria-label="Replay controls">
      <div class="transport">
        <button id="previous" class="button step" type="button" aria-label="Previous event">←</button>
        <button id="play" class="button primary" type="button">Play</button>
        <button id="next" class="button step" type="button" aria-label="Next event">→</button>
      </div>
      <div class="scrubber">
        <label for="position">Replay position</label>
        <input id="position" type="range" min="0" value="0" step="1">
      </div>
      <div class="counter"><strong id="step-count"></strong><span id="elapsed"></span></div>
    </section>
    <div class="workspace">
      <section class="map" aria-labelledby="map-title">
        <header class="panel-heading">
          <div><h2 id="map-title">Agent map</h2><p>Follow assignments from the coordinator.</p></div>
          <button id="clear" class="button" type="button">Show all</button>
        </header>
        <div class="diagram">
          <canvas id="connections" aria-hidden="true"></canvas>
          <div id="root" class="coordinator"></div>
          <div id="workers" class="workers"></div>
        </div>
        <div id="agent-detail" class="agent-detail"></div>
      </section>
      <section class="activity" aria-labelledby="activity-title">
        <header class="panel-heading"><div><h2 id="activity-title">Activity</h2><p id="activity-scope"></p></div></header>
        <ol id="events" class="events" tabindex="0" aria-label="Replay events"></ol>
        <p id="empty" class="empty" hidden>No events for this view yet.</p>
      </section>
    </div>
    <footer class="footer"><span>Synthetic scenarios</span><span>Replays run entirely in the browser.</span></footer>
    <p id="notice" class="notice" role="status" hidden></p>
  </main>
  <noscript>This replay needs JavaScript to run.</noscript>
</body>
</html>
